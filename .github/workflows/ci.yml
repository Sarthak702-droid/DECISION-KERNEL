name: Rust and PostgreSQL

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kernel_test
          POSTGRES_DB: kernel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kernel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:kernel_test@127.0.0.1:5432/kernel_test
      KERNEL_TEST_DATABASE_URL: postgres://postgres:kernel_test@127.0.0.1:5432/kernel_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: OpenAPI contract validation tools
        run: |
          python3 -m venv /tmp/kernel-contract-venv
          /tmp/kernel-contract-venv/bin/pip install -r scripts/requirements-contract.txt
          echo "/tmp/kernel-contract-venv/bin" >> "$GITHUB_PATH"
      - run: make tier5
        env:
          KERNEL_VALIDATE_OPENAPI: '1'
          KERNEL_TEST_PSQL_CONTAINER: ${{ job.services.postgres.id }}
      - name: Immutable image smoke
        run: |
          cp audit/2026-11-02-tier5/results.json prior-tier-evidence.json
          python3 scripts/package-images.py --output images.json
          python3 scripts/verify-tier5.py --images images.json --prior-tier-evidence prior-tier-evidence.json
        env:
          KERNEL_TEST_PSQL_CONTAINER: ${{ job.services.postgres.id }}

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: python3 scripts/check-dependencies.py
      - run: cargo audit
      - run: cargo deny check
