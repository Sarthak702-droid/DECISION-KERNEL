name: Rust and PostgreSQL

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kernel_test
          POSTGRES_DB: kernel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kernel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:kernel_test@127.0.0.1:5432/kernel_test
      KERNEL_TEST_DATABASE_URL: postgres://postgres:kernel_test@127.0.0.1:5432/kernel_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p kernelctl -- migrate
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p kernelctl -- replay packs/examples/support-triage.json tests/support-triage-replay.json

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check
